name: site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "CHANGELOG.md"
      - "src/site_release.rs"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-gate
  cancel-in-progress: false

jobs:
  render_site_rust:
    name: Zero-Python Rust Site Template Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: ./target/release/nala-halogen-rs site-release render website /tmp/nala-halogen-site
      - run: ./target/release/nala-halogen-rs sheriff-audit .
