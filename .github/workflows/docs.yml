name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "llms.txt"
      - "mkdocs.yml"
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-gate
  cancel-in-progress: true

jobs:
  check_docs_rust:
    name: Zero-Python Rust Docs Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - run: ./target/release/nala-halogen-rs check-docs .
      - run: ./target/release/nala-halogen-rs inject-blurbs .
      - run: ./target/release/nala-halogen-rs sheriff-audit .
